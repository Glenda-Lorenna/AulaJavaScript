<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="login-card">
		<h1>Bem-vindo</h1>
		<p class="subtitle">Digite seu nome para continuar</p>

		<form id="login-form">
			<label for="username">Nome do usuário</label>
			<input
				id="username"
				name="username"
				type="text"
				placeholder="Digite seu nome"
				autocomplete="name"
				required
			>
			<button type="submit">Entrar</button>
		</form>

		<p id="greeting" class="greeting" role="status" aria-live="polite"></p>
	</main>

	<script src="script.js"></script>
</body>
</html>
